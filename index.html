<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página personal de Benicio Díaz Cabeza. Niño y jugador de FIFA.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#101827">
  <title>Benicio Díaz Cabeza | Página personal</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #f5f7fb; background: radial-gradient(circle at top, #203b68, #101827 58%);
    }
    main {
      width: min(100%, 680px); padding: clamp(28px, 6vw, 54px);
      border: 1px solid #34445f; border-radius: 26px;
      background: rgba(13, 23, 40, .88); box-shadow: 0 24px 80px #0006;
      text-align: center;
    }
    .tag {
      display: inline-block; padding: 7px 13px; border-radius: 999px;
      color: #c7ddff; background: #233c61; font-size: .85rem; letter-spacing: .04em;
    }
    h1 { margin: 22px 0 10px; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.08; }
    .intro { margin: 0 auto; max-width: 440px; color: #c4cede; font-size: 1.1rem; }
    section {
      margin-top: 34px; padding-top: 25px; border-top: 1px solid #34445f;
      text-align: left;
    }
    h2 { margin: 0 0 16px; font-size: 1.15rem; color: #9fc5ff; }
    dl { margin: 0; display: grid; grid-template-columns: 130px 1fr; gap: 12px 18px; }
    dt { color: #aebbd0; }
    dd { margin: 0; font-weight: 600; }
    footer { margin-top: 30px; color: #8291a8; font-size: .82rem; }
    @media (max-width: 420px) { dl { grid-template-columns: 1fr; gap: 5px; } dd { margin-bottom: 10px; } }
  </style>
</head>
<body>
  <main>
    <span class="tag">PÁGINA PERSONAL</span>
    <h1>Benicio Díaz Cabeza</h1>
    <p class="intro">Niño con pasión por FIFA.</p>

    <section aria-labelledby="about-title">
      <h2 id="about-title">Sobre mí</h2>
      <dl>
        <dt>Nombre</dt><dd>Benicio Díaz Cabeza</dd>
        <dt>Descripción</dt><dd>Niño</dd>
        <dt>Profesión</dt><dd>Jugador de FIFA</dd>
      </dl>
    </section>

    <footer>Web personal de Benicio Díaz Cabeza</footer>
  </main>
</body>
</html>
